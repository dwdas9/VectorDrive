<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- VectorDrive sidebar icon (monochrome, currentColor for theming) -->

  <!-- Convergence paths from chunk nodes to origin -->
  <line x1="4.5" y1="5" x2="11.5" y2="16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  <line x1="3.5" y1="10" x2="11.5" y2="16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  <line x1="7.5" y1="6" x2="11.5" y2="16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Document chunk dots -->
  <circle cx="4.5" cy="5" r="1.5" fill="currentColor" opacity="0.6"/>
  <circle cx="3.5" cy="10" r="1.5" fill="currentColor" opacity="0.6"/>
  <circle cx="7.5" cy="6" r="1.5" fill="currentColor" opacity="0.6"/>

  <!-- Vector arrow shaft -->
  <line x1="11.5" y1="16.5" x2="18" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>

  <!-- Arrowhead -->
  <polygon points="20,4.5 18.5,8.5 16,6.2" fill="currentColor"/>

  <!-- Origin dot -->
  <circle cx="11.5" cy="16.5" r="2.2" fill="currentColor"/>
</svg>

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectordrive"
dynamic = ["version"]
description = "Local-first hybrid search and document-grounded Ollama chat over PDFs, DOCX, text, Markdown and images, with tiered OCR and a read-only MCP server."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }

dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-pptx>=1.0",
    "Pillow>=10.4",
    "sqlite-vec>=0.1.9",
    "numpy>=1.26",
    "httpx>=0.27",
    "mcp>=2,<3",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# Tier 2 (primary): RapidOCR on the onnxruntime backend — verified with a
# real macosx_14_0_arm64 wheel (onnxruntime 1.28.0) on this Apple Silicon
# machine. rapidocr>=3.0 pins to the unified `rapidocr` package (the
# RapidOCR class + EngineType/ModelType/OCRVersion enums used here) rather
# than the older split rapidocr_onnxruntime package.
ocr = [
    "rapidocr>=3.0",
    "onnxruntime>=1.28",
]
# Tier 3 (optional, off by default): PaddleOCR-VL. Verified working end to
# end on this Apple Silicon machine via the 'native' PaddlePaddle-CPU
# backend (paddlepaddle 3.3.1, paddleocr 3.7.0, paddlex[ocr] 3.7.2) — a
# 0.9B-param model, ~1.9GB download to ~/.paddlex/official_models (outside
# the repo) on first use.
paddleocr-vl = [
    "paddlepaddle>=3.2.1",
    "paddleocr>=3.7",
    "paddlex[ocr]>=3.7",
]
# Tier 4 (optional, never primary): Tesseract via pytesseract. Still
# requires the `tesseract` binary itself (e.g. `brew install tesseract`) —
# not installable via pip.
tesseract = [
    "pytesseract>=0.3",
]
# v0.2: the local desktop GUI. On macOS, pywebview uses the system
# WKWebView via pyobjc — no bundled Chromium, small install. Kept as an
# optional extra (not a core dependency) so a CLI-only / MCP-only install
# never needs it — cli/gui_cmd.py -> gui/app.py catches the resulting
# ImportError and prints this exact install command.
gui = [
    "pywebview>=5.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # xlwt only writes legacy .xls (openpyxl only writes .xlsx) — needed
    # solely to generate the legacy-Excel test fixture, never at runtime.
    "xlwt>=1.3",
]

[project.scripts]
vectordrive = "vectordrive.cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "vectordrive.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# schema.sql is read at runtime via Path(__file__).parent / "schema.sql"
# (db/connection.py) — without this, setuptools' default packages.find only
# picks up *.py files, so a built wheel silently omits it and `vectordrive
# index`/`status`/`mcp` (anything that calls connect()) crashes with
# FileNotFoundError on a real install, even though `doctor` and `--help`
# both look fine (found in M12's clean-install validation: editable/dev
# installs point straight at the source tree, masking this completely).
# v0.2 G3: gui/web/**/* (HTML/CSS/JS assets, read at runtime via
# gui/app.py's WEB_DIR) hits the exact same trap — package-data is the
# only thing that makes setuptools include non-.py files in a built wheel;
# editable/dev installs mask its absence completely, same as schema.sql
# did before M12. tests/packaging/test_wheel_contents.py (G10) asserts
# these are actually present in a real built wheel, not just declared here.
vectordrive = ["db/schema.sql", "gui/web/*", "gui/web/views/*", "gui/web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = [
    "live: requires a real local service (e.g. Ollama) to be running",
    "heavy: exercises a large local ML model for real (e.g. PaddleOCR-VL) — slow, downloads/loads real weights",
    "benchmark: measures timing for reporting purposes only — never asserts on elapsed time (pass/fail is correctness-only)",
    "packaging: builds the wheel via `python -m build` and inspects it — slow, runs a real subprocess build",
    "gui: exercises the desktop GUI layer (services with a fake window, or static web-asset checks) — never opens a real pywebview window in automated tests",
]

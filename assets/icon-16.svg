<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- VectorDrive 16px simplified icon -->

  <!-- Convergence paths from chunk nodes to origin (blue) -->
  <line x1="3" y1="3.5" x2="7.5" y2="11" stroke="#4A90D9" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="2.5" y1="6.5" x2="7.5" y2="11" stroke="#4A90D9" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="5" y1="4" x2="7.5" y2="11" stroke="#4A90D9" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

  <!-- Document chunk dots (blue) -->
  <circle cx="3" cy="3.5" r="1.2" fill="#4A90D9"/>
  <circle cx="2.5" cy="6.5" r="1.2" fill="#4A90D9"/>
  <circle cx="5" cy="4" r="1.2" fill="#4A90D9"/>

  <!-- Vector arrow shaft (purple) -->
  <line x1="7.5" y1="11" x2="12" y2="5" stroke="#7E57C2" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arrowhead (purple) -->
  <polygon points="13.5,3.5 12.8,6.2 10.6,4.6" fill="#7E57C2"/>

  <!-- Origin dot (green) -->
  <circle cx="7.5" cy="11" r="1.6" fill="#43A047"/>
</svg>
